<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shadow Creed: Bloodlines</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a id="dl" href="https://jsdelivr.net" download="three.min.js" style="position:fixed;top:150px;left:20px;z-index:9999;background:red;color:white;padding:15px;font-size:18px;">TAP HERE TO DOWNLOAD THREE.MIN.JS</a>

  <div id="hud">
    <h1>Shadow Creed: Cyprus</h1>
    <p>Targets Remaining: <span id="targets-left">3</span></p>
    <p>Status: <span id="status">HIDDEN</span></p>
    <p id="controls-hint">Loading 3D Engine...</p>
  </div>

  <div id="prompt">ASSASSINATE</div>

  <div id="message">
    <h2 id="msg-title">MISSION COMPLETE</h2>
    <p id="msg-sub">All targets eliminated without compromise.</p>
    <button id="restart-btn">Play Again</button>
  </div>

  <!-- Mobile Controls -->
  <div id="touch-ui">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>
    <div id="action-buttons">
      <div class="btn" id="btn-sneak">SNEAK</div>
      <div class="btn" id="btn-jump">JUMP</div>
      <div class="btn btn-strike" id="btn-strike">STRIKE</div>
    </div>
  </div>

  <script>
    const cdns = [
      'https://jsdelivr.net',
      'https://cloudflare.com',
      'https://unpkg.com'
    ];

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }

    (async function boot() {
      for (const url of cdns) {
        try {
          await loadScript(url);
          if (typeof THREE !== 'undefined') break;
        } catch (e) {}
      }

      if (typeof THREE === 'undefined') {
        const hint = document.getElementById('controls-hint');
        hint.style.color = '#ff6b6b';
        hint.textContent = 'Offline/Blocked: Download three.min.js into your project folder.';
        return;
      }

      await loadScript('script.js');
    })();
  </script>
</body>
</html>
